name: Deploy VKU Field Survey to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 [CI/CD] Bắt đầu triển khai phiên bản mới..."
            cd ~/vku-field-survey
            
            echo "📥 [1/4] Kéo mã nguồn mới nhất từ GitHub..."
            git pull origin main
            
            echo "📦 [2/4] Cập nhật dependencies..."
            npm install
            
            echo "🛠️ [3/4] Biên dịch Production Build (PWA & Vite)..."
            npm run build
            
            echo "🔄 [4/4] Khởi động lại ứng dụng với PM2..."
            pm2 restart vku-field-survey
            
            echo "✅ [CI/CD] Triển khai thành công! Server đang chạy tại cổng 5000 / cổng 80."
